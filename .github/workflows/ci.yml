name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: synthetic end-to-end demo
        run: PYTHONPATH=. python tests/test_smoke.py
      - name: conformal guarantee, fault law, reduced-order twin
        run: PYTHONPATH=. python tests/test_conformal.py
      - name: PyBAMM twin (skips when PyBAMM is absent)
        run: PYTHONPATH=. python tests/test_twin_pybamm.py
